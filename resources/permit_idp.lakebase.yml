# Lakebase for the review app's officer decisions (schema review_app, owned by the app).
resources:
  postgres_projects:
    permit_review:
      project_id: ${var.lakebase_project}
      display_name: "Customs Permit Pack Check (demo)"
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: "300s"
