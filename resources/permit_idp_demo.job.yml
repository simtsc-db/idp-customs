resources:
  jobs:
    permit_idp_demo:
      name: "Permit Pack Check - end-to-end demo run"
      description: "Synthetic trader permit packs -> UC volume -> Lakeflow SDP medallion (parse, classify, extract, FTA checks) -> governance + app grants -> Genie space -> accuracy and cost scorecard (MLflow)."
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: app_sp
          default: ${resources.apps.permit_review_app.service_principal_client_id}
      environments:
        - environment_key: datagen
          spec:
            environment_version: "4"
            dependencies:
              - /Volumes/${var.catalog}/${var.schema}/libs/datagen/charset_normalizer-3.5.2-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
              - /Volumes/${var.catalog}/${var.schema}/libs/datagen/pillow-13.0.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
              - /Volumes/${var.catalog}/${var.schema}/libs/datagen/pypdfium2-5.15.2-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
              - /Volumes/${var.catalog}/${var.schema}/libs/datagen/reportlab-5.1.0-py3-none-any.whl
        - environment_key: eval
          spec:
            environment_version: "4"
      tasks:
        - task_key: generate_permit_packs
          environment_key: datagen
          spark_python_task:
            python_file: ../src/00_generate_data.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}"]
        - task_key: refresh_idp_pipeline
          depends_on:
            - task_key: generate_permit_packs
          pipeline_task:
            pipeline_id: ${resources.pipelines.permit_idp_pipeline.id}
            full_refresh: false
        - task_key: apply_governance
          depends_on:
            - task_key: refresh_idp_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/02_governance.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              app_sp: "{{job.parameters.app_sp}}"
        - task_key: publish_genie_space
          depends_on:
            - task_key: apply_governance
          environment_key: eval
          spark_python_task:
            python_file: ../src/03_genie/publish_genie.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}",
                         "--warehouse_id", "${var.warehouse_id}",
                         "--parent_path", "/Workspace/Users/${workspace.current_user.userName}",
                         "--spec", "${workspace.file_path}/src/03_genie/permit_review.genie.json"]
        - task_key: evaluate_accuracy_and_cost
          depends_on:
            - task_key: refresh_idp_pipeline
          environment_key: eval
          spark_python_task:
            python_file: ../src/04_eval/evaluate.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}",
                         "--pipeline_id", "${resources.pipelines.permit_idp_pipeline.id}",
                         "--experiment", "${resources.experiments.permit_idp_eval.name}"]
